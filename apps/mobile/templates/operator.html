{% extends 'base.html' %}{% block content %}
<div class="fast-op"><div class="op-brand"><img src="/static/sl_logo.png"><div><b id="t_title"></b><small id="t_sub"></small></div></div>
<div class="op-card primary-track"><label id="t_wo"></label><input id="wo" class="operator-wo-input" autofocus autocomplete="off" autocapitalize="characters" placeholder="P005-110826"><button class="op-find" onclick="lookup()" id="t_check"></button><button class="camera-big" onclick="startCamera()" id="t_camera"></button><input id="photoScan" type="file" accept="image/*" capture="environment" hidden><video id="cam" class="camera hidden" autoplay playsinline></video><button id="frameReadBtn" class="camera-big hidden" onclick="readCameraFrame()">READ QR FROM LIVE FRAME</button><div id="cameraMsg" class="muted"></div><a id="secureScanLink" class="button hidden" target="_self">Open secure camera page</a></div>
<div id="result" class="hidden"><div class="op-card"><div class="status-title" id="t_plan"></div><div id="planSuggested" class="status-big">—</div><div id="planFacts"></div><div id="sectionStatus" class="section-status"></div><div class="section-status op-card" style="margin-top:10px"><b>SECTION OPEN / CLOSED · DAILY STATUS</b><select id="statusSection"><option>Preparation</option><option>Mixing</option><option>Forming</option><option>Firing</option><option>Grinding</option><option>Cutting</option><option>Packing</option><option>QC</option></select><select id="statusValue"><option value="OPEN">OPEN</option><option value="CLOSED">CLOSED</option></select><input id="statusQty" type="number" min="0" step="1" placeholder="Actual quantity (blank = unknown)"><input id="statusRemark" placeholder="Remark"><button class="op-find" onclick="saveSectionStatus()">SAVE SECTION STATUS</button><div id="statusMsg" class="muted"></div></div><button id="auditPhotoBtn" class="camera-big" onclick="openAudit()">📸 PHYSICAL AUDIT · PART PHOTO · SAVE LOCATION</button></div><div class="op-card audit-card"><div class="status-title" id="t_audit"></div><div id="lastAudit" class="status-big">—</div></div></div>
<div id="quickAudit" class="op-card hidden" style="border:3px solid #f58220"><div class="status-title">📸 PHYSICAL AUDIT — SAVE NOW</div><label>Verified Quantity / จำนวนจริง</label><input id="qaQty" type="number" min="0" step="1" placeholder="Quantity"><label>Physical Location / Section</label><input id="qaLoc" placeholder="Area / machine / rack / pallet"><label>Remark / Notes</label><input id="qaRemark" placeholder="Remark / problem / identification"><label>Part Picture</label><input id="qaPhoto" type="file" accept="image/*" capture="environment"><select id="qaStatus"><option value="OK">OK</option><option value="SHORT">SHORT</option><option value="EXCESS">EXCESS</option><option value="NOT_FOUND">NOT FOUND</option><option value="WRONG_LOCATION">WRONG LOCATION</option><option value="DAMAGE">DAMAGE</option><option value="HOLD">HOLD</option><option value="OTHER">OTHER</option></select><button class="op-find" onclick="saveQuickAudit()">✅ SAVE QTY + LOCATION + REMARK + PHOTO</button><div id="qaMsg" class="muted"></div></div>
<div class="op-card"><label id="t_section"></label><select id="terminal"><option value="" id="t_select"></option>{% for t in terminals %}<option value="{{t.terminal_code}}">{{t.process_name}} — {{t.location}}</option>{% endfor %}</select></div>
<div class="op-actions"><button onclick="send('RECEIVE')">📍 <span id="t_here"></span></button><button onclick="send('COMPLETE')">✅ <span id="t_complete"></span></button><button onclick="problem()">⚠️ <span id="t_problem"></span></button><button onclick="unidentified()">❓ <span id="t_unknown"></span></button></div><div id="problemBox" class="op-card hidden"><div class="problem-grid"><button onclick="pick('MACHINE')">⚙️ MACHINE</button><button onclick="pick('MATERIAL')">🧱 MATERIAL</button><button onclick="pick('QUALITY/NCR')">❌ NCR</button><button onclick="pick('WAITING')">⏳ WAITING</button></div><input id="notes"></div></div>
<script>
const L={en:{title:'FAST PART TRACKING',sub:'Type WO or scan QR',wo:'WORK ORDER NUMBER',check:'SHOW STATUS',camera:'📷 SCAN QR WITH CAMERA',plan:'PLAN-2026 STATUS',audit:'LAST PHYSICAL AUDIT',section:'PHYSICAL LOCATION / SECTION',select:'Select location',here:'SAVE HERE',complete:'COMPLETE',problem:'PROBLEM',unknown:'NOT FOUND',notfound:'Work Order not found',noaudit:'No physical audit yet',camblock:'Camera live scan needs browser camera permission. If blocked on LAN HTTP, your phone camera/file capture will open instead.'},th:{title:'ติดตามชิ้นงานด่วน',sub:'พิมพ์ WO หรือสแกน QR',wo:'เลขใบสั่งงาน',check:'แสดงสถานะ',camera:'📷 สแกน QR ด้วยกล้อง',plan:'สถานะจาก PLAN-2026',audit:'ตรวจหน้างานล่าสุด',section:'ตำแหน่งจริง / แผนก',select:'เลือกตำแหน่ง',here:'บันทึกที่นี่',complete:'เสร็จ',problem:'ปัญหา',unknown:'หาไม่พบ',notfound:'ไม่พบใบสั่งงาน',noaudit:'ยังไม่มีการตรวจหน้างาน',camblock:'หากเบราว์เซอร์บล็อกกล้องบน HTTP ให้ใช้กล้อง/ถ่ายภาพของโทรศัพท์แทน'},my:{title:'အစိတ်အပိုင်း အမြန်ခြေရာခံ',sub:'WO ရိုက်ပါ သို့ QR စကင်ပါ',wo:'အလုပ်အမိန့်နံပါတ်',check:'အခြေအနေပြ',camera:'📷 QR ကင်မရာစကင်',plan:'PLAN-2026 အခြေအနေ',audit:'နောက်ဆုံးလက်တွေ့စစ်ဆေးမှု',section:'လက်ရှိနေရာ / ဌာန',select:'နေရာရွေးရန်',here:'ဤနေရာသိမ်း',complete:'ပြီးစီး',problem:'ပြဿနာ',unknown:'မတွေ့ပါ',notfound:'အလုပ်အမိန့်မတွေ့ပါ',noaudit:'လက်တွေ့စစ်ဆေးမှုမရှိသေးပါ',camblock:'HTTP LAN တွင် ကင်မရာပိတ်ထားပါက ဖုန်းကင်မရာ/ဓာတ်ပုံကို အသုံးပြုပါ'}};
const $=x=>document.getElementById(x);let issue='';let currentWO='';let liveStream=null;let scanActive=false;function applyLang(l){let d=L[l]||L.en;Object.keys(d).forEach(k=>{let e=$('t_'+k);if(e)e.textContent=d[k]});if(!$('lastAudit').dataset.loaded)$('lastAudit').textContent=d.noaudit;}document.addEventListener('sl-language',e=>applyLang(e.detail));window.addEventListener('DOMContentLoaded',()=>applyLang(window.SL_LANG||'en'));
function qrToWO(v){v=String(v||'').trim();try{let u=new URL(v);v=decodeURIComponent(u.pathname.split('/').filter(Boolean).pop()||v)}catch(e){}return v.replace(/^SLWO\s*[:=#-]\s*/i,'').trim();}
$('wo').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();lookup()}});
async function lookup(){let q=qrToWO($('wo').value);if(!q)return;let j=await (await fetch('/api/wo-search?q='+encodeURIComponent(q))).json();if(!(j.rows&&j.rows.length)){$('result').classList.add('hidden');$('cameraMsg').textContent=(L[window.SL_LANG]||L.en).notfound;return;}let w=j.rows[0];$('wo').value=w.wo_id;currentWO=w.wo_id;let d=await (await fetch('/api/wo/'+encodeURIComponent(w.wo_id))).json();if(!d.ok)return;let z=d.wo;$('result').classList.remove('hidden');$('quickAudit').classList.remove('hidden');$('qaQty').value=z.qty||'';$('qaLoc').value=z.plan_location||'';$('planSuggested').textContent=(z.plan_location||d.plan_status||'Planning');$('planFacts').innerHTML='<b>'+z.wo_id+'</b> · '+(z.product_code||'—')+'<br>QTY <b>'+Number(z.qty||0).toLocaleString()+'</b> · Initial due <b>'+(z.initial_due_date||z.due_date||'—')+'</b><br>Revised '+(z.revised_due_date||'—')+' · Sales '+(z.sales_delivery_date||'—')+'<br>Mill batches (BY): <b>'+(z.mill_batches??'—')+'</b>';let ss=(d.section_status||[]);$('sectionStatus').innerHTML=ss.length?'<div style="margin-top:10px;font-weight:900">SECTION OPEN / CLOSED</div>'+ss.map(x=>'<div style="display:flex;justify-content:space-between;padding:7px;border-bottom:1px solid #ddd"><span>'+x.section+' ('+x.field+')</span><b>'+x.state+'</b></div>').join(''):'';
if(d.last_audit){$('lastAudit').dataset.loaded='1';$('lastAudit').textContent=(d.last_audit.physical_status||'—')+' · '+(d.last_audit.physical_location||'—')+' · Qty '+(d.last_audit.verified_qty??'—')+' · '+(d.last_audit.created_at||'')}else{$('lastAudit').dataset.loaded='';$('lastAudit').textContent=(L[window.SL_LANG]||L.en).noaudit;}}
function stopCamera(){scanActive=false;if(liveStream){liveStream.getTracks().forEach(t=>t.stop());liveStream=null;}$('cam').srcObject=null;$('cam').classList.add('hidden');$('frameReadBtn').classList.add('hidden');}
async function startCamera(){
  $('cameraMsg').textContent='Opening rear camera…';$('photoScan').value='';
  if(!navigator.mediaDevices?.getUserMedia){$('cameraMsg').textContent='Live camera needs HTTPS and camera permission. Opening the phone camera/photo fallback.';showSecureScannerLink();$('photoScan').click();return;}
  try{
    liveStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
    const v=$('cam');v.srcObject=liveStream;v.classList.remove('hidden');await v.play();scanActive=true;
    if(!window.BarcodeDetector){$('cameraMsg').textContent='Camera is live. Point at one QR, then tap Read QR from live frame.';$('frameReadBtn').classList.remove('hidden');return;}
    const detector=new BarcodeDetector({formats:['qr_code']});$('cameraMsg').textContent='Point the rear camera at one QR code…';
    const loop=async()=>{if(!scanActive)return;try{const hits=await detector.detect(v);if(hits.length===1){await submitScannedFrame(hits[0].rawValue);return;}if(hits.length>1){$('cameraMsg').textContent='More than one QR found. Scan one label at a time.';}}catch(e){}if(scanActive)setTimeout(loop,180);};loop();
  }catch(e){stopCamera();$('cameraMsg').textContent='Camera could not start: '+e.name+'. Allow camera permission and use HTTPS, or use the phone camera/photo fallback.';showSecureScannerLink();$('photoScan').click();}
}
function showSecureScannerLink(){try{const a=$('secureScanLink');a.href=new URL(location.pathname+location.search,'https://'+location.hostname+':8443').href;a.classList.remove('hidden');}catch(e){}}
async function submitScannedFrame(value){const v=$('cam');const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);const blob=await new Promise(ok=>c.toBlob(ok,'image/jpeg',0.82));if(!blob){$('cameraMsg').textContent='Could not capture the QR image. Try again.';return;}const fd=new FormData();fd.append('photo',blob,'qr-scan.jpg');fd.append('value',value);$('cameraMsg').textContent='Saving QR scan evidence…';try{const j=await(await fetch('/api/record-qr-photo',{method:'POST',body:fd})).json();if(j.ok&&j.wo_id){stopCamera();currentWO=j.wo_id;window.location='/mobile/wo/'+encodeURIComponent(currentWO);return;}$('cameraMsg').textContent=j.error||'QR read, but the work order was not found.';}catch(e){$('cameraMsg').textContent='Scan submit failed. Keep the label in view and retry.';}}
async function readCameraFrame(){const v=$('cam');const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);const blob=await new Promise(ok=>c.toBlob(ok,'image/jpeg',0.82));if(!blob){$('cameraMsg').textContent='Could not capture camera frame.';return;}const fd=new FormData();fd.append('photo',blob,'qr-scan.jpg');$('cameraMsg').textContent='Reading QR…';try{const j=await(await fetch('/api/decode-qr-photo',{method:'POST',body:fd})).json();if(j.ok&&j.wo_id){stopCamera();currentWO=j.wo_id;window.location='/mobile/wo/'+encodeURIComponent(currentWO);return;}$('cameraMsg').textContent=j.error||'QR not read. Move closer, hold steady, and try again.';}catch(e){$('cameraMsg').textContent='QR read failed. Retry or type the work order.';}}
$('photoScan').addEventListener('change',async e=>{let f=e.target.files[0];if(!f)return;$('cameraMsg').textContent='Reading QR and saving scan evidence…';try{if(window.BarcodeDetector){let bm=await createImageBitmap(f);let b=await new BarcodeDetector({formats:['qr_code']}).detect(bm);if(b.length){let fd=new FormData();fd.append('photo',f);fd.append('value',b[0].rawValue);let j=await(await fetch('/api/record-qr-photo',{method:'POST',body:fd})).json();if(j.ok){currentWO=j.wo_id;window.location='/mobile/wo/'+encodeURIComponent(currentWO);return}$('cameraMsg').textContent=j.error||'Work Order not found';return}}let fd=new FormData();fd.append('photo',f);let j=await(await fetch('/api/decode-qr-photo',{method:'POST',body:fd})).json();if(j.ok&&j.wo_id){currentWO=j.wo_id;window.location='/mobile/wo/'+encodeURIComponent(currentWO);return}$('cameraMsg').textContent=j.error||'QR not read. Try again or type the WO.'}catch(x){$('cameraMsg').textContent='QR read failed. Try again or type the WO.'}});
window.addEventListener('pagehide',stopCamera);
function openAudit(){let w=currentWO||qrToWO($('wo').value);if(w)window.location='/mobile/wo/'+encodeURIComponent(w)}
async function saveQuickAudit(){if(!currentWO){$('qaMsg').textContent='Find Work Order first';return;}let fd=new FormData();fd.append('wo_id',currentWO);let q=$('qaQty').value;if(q)fd.append('verified_qty',q);fd.append('physical_status',$('qaStatus').value);fd.append('physical_location',$('qaLoc').value);fd.append('observed_process',$('planSuggested').textContent||'');fd.append('notes',$('qaRemark').value);let ph=$('qaPhoto').files&&$('qaPhoto').files[0];if(ph)fd.append('photo',ph);$('qaMsg').textContent='Saving…';try{let r=await fetch('/api/mobile-audit',{method:'POST',body:fd});let j=await r.json();$('qaMsg').textContent=j.ok?'SAVED ✓'+(j.photo_url?' · PHOTO SAVED':''):(j.error||'Save failed');if(j.ok)lookup()}catch(e){$('qaMsg').textContent='Network error: '+e;}}
async function saveSectionStatus(){if(!currentWO){$('statusMsg').textContent='Find/scan and confirm the work order first.';return;}const qty=$('statusQty').value;const payload={wo_id:currentWO,section:$('statusSection').value,status:$('statusValue').value,actual_qty:qty===''?null:Number(qty),remark:$('statusRemark').value};$('statusMsg').textContent='Saving…';try{const r=await fetch('/api/section-status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const j=await r.json();$('statusMsg').textContent=j.ok?'SAVED ✓ '+j.section+' '+j.status+' · '+(j.saved_at||''):(j.error||'Save failed');}catch(e){$('statusMsg').textContent='Network error: '+e;}}
async function send(action){let j=await (await fetch('/api/operator-event',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({wo_id:$('wo').value,action,terminal_code:$('terminal').value,issue,notes:$('notes')?.value||''})})).json();$('cameraMsg').textContent=j.ok?'SAVED ✓ '+j.wo_id:j.error;if(j.ok)lookup()}function problem(){$('problemBox').classList.remove('hidden')}function pick(x){issue=x;send('HOLD')}async function unidentified(){let note=prompt('Note / Qty / Description')||'';let j=await (await fetch('/api/unidentified',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({location:$('terminal').value,issue:'UNIDENTIFIED',notes:note})})).json();$('cameraMsg').textContent=j.ok?'SAVED '+j.temp_id:j.error}
</script>{% endblock %}
