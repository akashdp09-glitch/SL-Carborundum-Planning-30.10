{% extends 'base.html' %}{% block content %}
<div class="login-card">
  <h1>SL Planning Center</h1>
  <p class="muted">Fast Work Order, QR and shop-floor status MVP</p>
  {% if error %}<div class="alert danger">{{ error }}</div>{% endif %}
  <form method="post" action="/login">
    <label>Username</label><input name="username" autocomplete="username" autofocus required>
    <label>Password</label><input type="password" name="password" autocomplete="current-password" required>
    <button class="primary full">Login</button>
  </form>
  <div class="hint">Use the account provided by your software administrator. Do not share your password.</div>
</div>
{% endblock %}
